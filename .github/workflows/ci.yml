name: Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/layer-4-semantic-rag]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile all Python files
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          import sys

          failures = []
          for path in pathlib.Path('.').rglob('*.py'):
              if any(part in {'.git', 'venv', '.venv', '__pycache__'} for part in path.parts):
                  continue
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append(f"{path}:\n{exc.msg}")
          if failures:
              print('\n\n'.join(failures))
              sys.exit(1)
          print('All Python files compiled successfully.')
          PY

      - name: Import production application
        env:
          CRIDERGPT_ENGINE_API_KEY: ci-test-key
          VIDEO_BACKEND: local
        run: python -c "import app; assert app.app.title == 'CriderGPT Engine'"

      - name: Run tests
        env:
          CRIDERGPT_ENGINE_API_KEY: ci-test-key
          VIDEO_BACKEND: local
        run: python -m pytest -q

      - name: Validate deployment scripts
        run: |
          bash -n deployment/update.sh
          test -f deployment/cridergpt-engine.service
          test -f deployment/cridergpt-video-worker.service
          test -f deployment/cridergpt-engine-update.service
          test -f deployment/cridergpt-engine-update.timer
